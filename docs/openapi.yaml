openapi: 3.0.3
info:
  title: Valoriza API
  version: 1.0.0
  description: >
    API de reconhecimento entre colegas: elogios ligados aos valores (tags) da empresa.
    Projeto de estudo (N1). Erros sempre no formato {"error": "mensagem"}, com a mensagem em português.
    Respostas comuns a todas as rotas, fora das listadas em cada operação:
    404 para rota inexistente, 413 para corpo JSON acima de 10 kB e 500 para erro interno.
servers:
  - url: http://localhost:3000
    description: Local (npm run dev)
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        error: { type: string, example: "Faça login para continuar." }
    UsuarioPublico:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    UsuarioProprio:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        admin: { type: boolean }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Parceria }
        name_custom: { type: string, example: "#Parceria" }
    Elogio:
      type: object
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        created_at: { type: string, format: date-time }
        tag: { $ref: "#/components/schemas/Tag" }
        sender: { $ref: "#/components/schemas/UsuarioPublico" }
        receiver: { $ref: "#/components/schemas/UsuarioPublico" }
    PaginaDeElogios:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Elogio" } }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Invalido:
      description: Dados inválidos (validação com zod)
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    SemLogin:
      description: Sem token, token inválido ou expirado
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
paths:
  /health:
    get:
      summary: Confere se a API está no ar
      responses:
        "200":
          description: No ar
          content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } }
  /users:
    post:
      summary: Cadastra um usuário (o campo admin é ignorado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Criado
          content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioProprio" } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "409":
          description: Já existe um usuário com este e-mail
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    get:
      summary: Lista os usuários (só id e nome)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UsuarioPublico" } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
  /login:
    post:
      summary: Autentica e devolve o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/UsuarioProprio" }
        "400": { $ref: "#/components/responses/Invalido" }
        "401":
          description: E-mail ou senha incorretos
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
  /tags:
    post:
      summary: Cria uma tag (só admin)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "201":
          description: Criada
          content: { application/json: { schema: { $ref: "#/components/schemas/Tag" } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
        "403":
          description: Usuário sem permissão de admin
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "409":
          description: Esta tag já existe (sem diferenciar maiúsculas)
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    get:
      summary: Lista as tags
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lista
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Tag" } } } }
        "401": { $ref: "#/components/responses/SemLogin" }
  /compliments:
    post:
      summary: Envia um elogio a um colega, ligado a uma tag
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id, user_receiver, message]
              properties:
                tag_id: { type: string, format: uuid }
                user_receiver: { type: string, format: uuid }
                message: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Criado
          content: { application/json: { schema: { $ref: "#/components/schemas/Elogio" } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
        "404":
          description: Destinatário ou tag não encontrados
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
        "422":
          description: Não é possível elogiar a si mesmo
          content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
  /users/compliments/send:
    get:
      summary: Elogios enviados pelo usuário logado, mais recentes primeiro
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200":
          description: Uma página
          content: { application/json: { schema: { $ref: "#/components/schemas/PaginaDeElogios" } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
  /users/compliments/receive:
    get:
      summary: Elogios recebidos pelo usuário logado, mais recentes primeiro
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200":
          description: Uma página
          content: { application/json: { schema: { $ref: "#/components/schemas/PaginaDeElogios" } } }
        "400": { $ref: "#/components/responses/Invalido" }
        "401": { $ref: "#/components/responses/SemLogin" }
  /users/compliments/summary:
    get:
      summary: Elogios recebidos por valor, do maior para o menor
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag_id: { type: string, format: uuid }
                        tag: { type: string }
                        total: { type: integer }
        "401": { $ref: "#/components/responses/SemLogin" }
